<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1324">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Taxi Ledger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="authView" class="auth-shell">
    <div class="auth-card">
      <div class="brand brand-auth"><span class="brand-mark">TL</span><div><strong>Taxi Ledger</strong><small>Il tuo cruscotto di lavoro</small></div></div>
      <div class="auth-tabs"><button class="active" data-auth-tab="login">Accedi</button><button data-auth-tab="register">Registrati</button></div>
      <form id="loginForm" class="auth-form">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required placeholder="nome@esempio.it"></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required minlength="4" placeholder="••••••••"></label>
        <button class="btn primary wide" type="submit">Accedi</button>
      </form>
      <form id="registerForm" class="auth-form hidden">
        <label>Nome<input id="registerName" required placeholder="Mario Rossi"></label>
        <label>Email<input id="registerEmail" type="email" required placeholder="nome@esempio.it"></label>
        <label>Password<input id="registerPassword" type="password" required minlength="4" placeholder="Almeno 4 caratteri"></label>
        <button class="btn primary wide" type="submit">Crea profilo</button>
      </form>
      <p id="authMessage" class="form-message"></p>
      <button id="demoLogin" class="link-button" type="button">Entra con il profilo demo</button>
      <p class="privacy-note">I dati restano in questo browser. Esporta periodicamente un backup dalle Impostazioni.</p>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="brand-mark">TL</span><div><strong>Taxi Ledger</strong><small>Gestione attività</small></div></div>
      <nav id="mainNav">
        <button class="nav-item active" data-page="dashboard"><span>▦</span> Cruscotto</button>
        <button class="nav-item" data-page="income"><span>↗</span> Incassi</button>
        <button class="nav-item" data-page="expenses"><span>↘</span> Spese</button>
        <button class="nav-item" data-page="shifts"><span>◷</span> Turni</button>
        <button class="nav-item" data-page="holidays"><span>☀</span> Ferie</button>
        <button class="nav-item" data-page="closing"><span>◎</span> Consuntivo</button>
        <button class="nav-item" data-page="settings"><span>⚙</span> Impostazioni</button>
      </nav>
      <div class="sidebar-footer"><span id="sidebarUser">Profilo</span><button id="logoutBtn" class="icon-btn" title="Esci">⇥</button></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn">☰</button>
        <div><h1 id="pageTitle">Cruscotto</h1><p id="pageSubtitle">Una vista chiara della tua attività</p></div>
        <div class="header-actions"><button class="btn income" data-open="income">＋ Incasso</button><button class="btn expense" data-open="expense">− Spesa</button></div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <dialog id="entryDialog" class="modal">
    <form id="entryForm" method="dialog">
      <div class="modal-head"><div><span id="entryEyebrow" class="eyebrow">Nuovo movimento</span><h2 id="entryTitle">Nuovo incasso</h2></div><button id="closeDialog" type="button" class="icon-btn">×</button></div>
      <input id="entryId" type="hidden"><input id="entryKind" type="hidden">
      <div class="form-grid">
        <label>Data<input id="entryDate" type="date" required></label>
        <label>Importo (€)<input id="entryAmount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="0,00"></label>
        <label id="incomeTypeField">Tipologia<select id="incomeType"><option>Carta</option><option>Contanti</option><option>Uber</option><option>FreeNow</option><option>ITTaxi</option></select></label>
        <label id="expenseCategoryField" class="hidden">Categoria<select id="expenseCategory"><option>Carburante</option><option>Manutenzione</option><option>Canone 3570</option><option>Gomme</option><option>Assicurazione</option><option>Lavaggio</option><option>Pedaggi</option><option>Commercialista</option><option>Altro</option></select></label>
        <label id="shiftField">Turno<select id="entryShift"><option>Mattina</option><option>Pomeriggio</option><option>Sera</option><option>Notte</option><option>Intero</option><option>Riposo</option></select></label>
        <label id="expenseStatusField" class="hidden">Stato<select id="expenseStatus"><option value="paid">Pagata</option><option value="planned">Pianificata</option></select><small id="statusHint">Impostato automaticamente dalla data</small></label>
        <label class="span-2">Note<textarea id="entryNotes" rows="3" placeholder="Aggiungi una nota facoltativa"></textarea></label>
      </div>
      <div class="modal-actions"><button id="deleteEntry" type="button" class="btn danger ghost hidden">Elimina</button><span class="spacer"></span><button id="cancelEntry" type="button" class="btn ghost">Annulla</button><button type="submit" class="btn primary">Salva</button></div>
    </form>
  </dialog>

  <dialog id="holidayDialog" class="modal compact">
    <form id="holidayForm" method="dialog">
      <div class="modal-head"><div><span class="eyebrow">Pianificazione</span><h2>Nuovo periodo di ferie</h2></div><button id="closeHolidayDialog" type="button" class="icon-btn">×</button></div>
      <div class="form-grid"><label>Dal<input id="holidayStart" type="date" required></label><label>Al<input id="holidayEnd" type="date" required></label><label class="span-2">Descrizione<input id="holidayLabel" value="Ferie personali"></label></div>
      <div class="modal-actions"><span class="spacer"></span><button type="button" id="cancelHoliday" class="btn ghost">Annulla</button><button type="submit" class="btn primary">Aggiungi</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
